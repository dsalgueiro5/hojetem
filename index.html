<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hoje Tem - Cartão Digital</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg-color: #0f0f12;
      --card-bg: #1a1a22;
      --accent-color: #f59e0b;
      --accent-hover: #d97706;
      --text-color: #f3f4f6;
      --text-secondary: #9ca3af;
      --danger-color: #ef4444;
      --success-color: #10b981;
    }
    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      padding-bottom: 80px;
      min-height: 100vh;
    }
    .app-header {
      background-color: var(--card-bg);
      border-bottom: 2px solid var(--accent-color);
      padding: 15px;
      text-align: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .app-logo-icon {
      font-size: 2.5rem;
      color: var(--accent-color);
      margin-bottom: 5px;
    }
    .app-title {
      font-weight: 800;
      letter-spacing: 2px;
      color: var(--accent-color);
      margin: 0;
      text-transform: uppercase;
      font-size: 1.4rem;
    }
    .card-custom {
      background: var(--card-bg);
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 8px 25px rgba(0,0,0,0.6);
      margin-bottom: 20px;
    }
    .stamp-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 10px;
      padding: 15px 0;
    }
    .stamp-slot {
      aspect-ratio: 1;
      background-color: #121216;
      border: 2px dashed #3a3a45;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      font-weight: bold;
      color: var(--text-secondary);
    }
    .stamp-slot.stamped {
      border: 2px solid var(--accent-color);
      background-color: rgba(245, 158, 11, 0.2);
      color: var(--accent-color);
    }
    .stamp-slot.red-cross {
      border: 2px solid var(--danger-color);
      background-color: rgba(239, 68, 68, 0.2);
      color: var(--danger-color);
    }
    .nav-bottom {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background-color: var(--card-bg);
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      justify-content: space-around;
      padding: 10px 0;
      z-index: 1000;
    }
    .nav-item-btn {
      background: none;
      border: none;
      color: var(--text-secondary);
      display: flex;
      flex-direction: column;
      align-items: center;
      font-size: 0.75rem;
    }
    .nav-item-btn.active {
      color: var(--accent-color);
      font-weight: bold;
    }
    .nav-item-btn i {
      font-size: 1.2rem;
      margin-bottom: 3px;
    }
    .btn-accent {
      background-color: var(--accent-color);
      color: #000;
      font-weight: 700;
      border: none;
    }
    .btn-accent:hover {
      background-color: var(--accent-hover);
      color: #000;
    }
    .badge-admin {
      background-color: var(--accent-color);
      color: #000;
      font-weight: bold;
      font-size: 0.7rem;
      padding: 3px 8px;
      border-radius: 10px;
    }
  </style>
</head>
<body>

  <header class="app-header">
    <div class="app-logo-icon"><i class="fa-solid fa-beer-mug-empty"></i></div>
    <h3 class="app-title">Hoje Tem</h3>
  </header>

  <div class="container mt-3" id="app-content">
    <!-- Conteúdo gerado automaticamente -->
  </div>

  <nav class="nav-bottom" id="app-nav" style="display: none;">
    <button class="nav-item-btn active" onclick="switchTab('card')">
      <i class="fa-solid fa-id-card"></i> Cartão
    </button>
    <button class="nav-item-btn" onclick="switchTab('events')">
      <i class="fa-solid fa-calendar-days"></i> Jantares
    </button>
    <button class="nav-item-btn" onclick="switchTab('ranking')">
      <i class="fa-solid fa-trophy"></i> Ranking
    </button>
    <button class="nav-item-btn" onclick="switchTab('admin')">
      <i class="fa-solid fa-user-shield"></i> Admin
    </button>
  </nav>

  <script>
    let activeUser = JSON.parse(localStorage.getItem('hojetem_user')) || null;

    let members = JSON.parse(localStorage.getItem('hojetem_members')) || [
      { id: 1, name: "Diogo Salgueiro", phone: "910000000", pass: "admin123", isAdmin: true, stamps: 3, crosses: 1 },
      { id: 2, name: "João Canastra", phone: "912345678", pass: "123", isAdmin: false, stamps: 4, crosses: 0 }
    ];

    function saveState() {
      localStorage.setItem('hojetem_members', JSON.stringify(members));
      if (activeUser) {
        localStorage.setItem('hojetem_user', JSON.stringify(activeUser));
      }
    }

    function initApp() {
      const content = document.getElementById('app-content');
      const nav = document.getElementById('app-nav');

      if (!activeUser) {
        nav.style.display = 'none';
        renderLoginView(content);
      } else {
        nav.style.display = 'flex';
        renderCardTab(content);
      }
    }

    function renderLoginView(container) {
      container.innerHTML = `
        <div class="card-custom p-4">
          <h4 class="text-center text-warning mb-4"><i class="fa-solid fa-right-to-bracket me-2"></i>Entrar no Hoje Tem</h4>
          <div class="mb-3">
            <label class="form-label small text-secondary">Nº de Telemóvel</label>
            <input type="tel" id="loginPhone" class="form-control bg-dark text-white border-secondary" placeholder="Ex: 910000000">
          </div>
          <div class="mb-4">
            <label class="form-label small text-secondary">Palavra-passe</label>
            <input type="password" id="loginPass" class="form-control bg-dark text-white border-secondary" placeholder="Tua palavra-passe">
          </div>
          <button class="btn btn-accent w-100 py-2 mb-3" onclick="handleLogin()">Entrar</button>
          <hr class="border-secondary">
          <p class="text-center small text-secondary mb-2">Primeiro acesso ou queres alterar os teus dados?</p>
          <button class="btn btn-outline-light btn-sm w-100" onclick="renderSetupAccountView(document.getElementById('app-content'))">
            Configurar Os Meus Dados / Registar
          </button>
        </div>
      `;
    }

    function handleLogin() {
      const phone = document.getElementById('loginPhone').value.trim();
      const pass = document.getElementById('loginPass').value.trim();

      const user = members.find(m => m.phone === phone && m.pass === pass);
      if (user) {
        activeUser = user;
        saveState();
        initApp();
      } else {
        alert("Telemóvel ou palavra-passe incorretos!");
      }
    }

    function renderSetupAccountView(container) {
      container.innerHTML = `
        <div class="card-custom p-4">
          <h4 class="text-center text-warning mb-3"><i class="fa-solid fa-user-gear me-2"></i>Configurar Dados</h4>
          <div class="mb-3">
            <label class="form-label small text-secondary">Nome Completo</label>
            <input type="text" id="setupName" class="form-control bg-dark text-white border-secondary" value="${activeUser ? activeUser.name : ''}" placeholder="O teu nome">
          </div>
          <div class="mb-3">
            <label class="form-label small text-secondary">Telemóvel Real</label>
            <input type="tel" id="setupPhone" class="form-control bg-dark text-white border-secondary" value="${activeUser ? activeUser.phone : ''}" placeholder="Ex: 912345678">
          </div>
          <div class="mb-4">
            <label class="form-label small text-secondary">Nova Palavra-passe</label>
            <input type="password" id="setupPass" class="form-control bg-dark text-white border-secondary" placeholder="Escolhe uma palavra-passe">
          </div>
          <button class="btn btn-accent w-100 py-2 mb-2" onclick="saveUserData()">Guardar Dados</button>
          <button class="btn btn-link text-secondary w-100 btn-sm" onclick="initApp()">Voltar</button>
        </div>
      `;
    }

    function saveUserData() {
      const name = document.getElementById('setupName').value.trim();
      const phone = document.getElementById('setupPhone').value.trim();
      const pass = document.getElementById('setupPass').value.trim();

      if (!name || !phone || !pass) {
        alert("Por favor preenche todos os campos!");
        return;
      }

      if (activeUser) {
        activeUser.name = name;
        activeUser.phone = phone;
        activeUser.pass = pass;
        const idx = members.findIndex(m => m.id === activeUser.id);
        if (idx !== -1) members[idx] = activeUser;
      } else {
        activeUser = {
          id: Date.now(),
          name: name,
          phone: phone,
          pass: pass,
          isAdmin: true,
          stamps: 0,
          crosses: 0
        };
        members.push(activeUser);
      }

      saveState();
      alert("Dados guardados com sucesso!");
      initApp();
    }

    function logout() {
      activeUser = null;
      localStorage.removeItem('hojetem_user');
      initApp();
    }

    function switchTab(tab) {
      document.querySelectorAll('.nav-item-btn').forEach(b => b.classList.remove('active'));
      if(event && event.currentTarget) event.currentTarget.classList.add('active');
      const content = document.getElementById('app-content');

      if (tab === 'card') renderCardTab(content);
      else if (tab === 'events') renderEventsTab(content);
      else if (tab === 'ranking') renderRankingTab(content);
      else if (tab === 'admin') renderAdminTab(content);
    }

    function renderCardTab(container) {
      let slotsHTML = '';
      for (let i = 0; i < 10; i++) {
        if (i < activeUser.stamps) {
          slotsHTML += `<div class="stamp-slot stamped"><i class="fa-solid fa-beer-mug-empty"></i></div>`;
        } else if (i < activeUser.stamps + activeUser.crosses) {
          slotsHTML += `<div class="stamp-slot red-cross"><i class="fa-solid fa-xmark"></i></div>`;
        } else {
          slotsHTML += `<div class="stamp-slot">${i+1}</div>`;
        }
      }

      container.innerHTML = `
        <div class="card-custom p-3 text-center">
          <div class="d-flex justify-content-between align-items-center mb-1">
            <h5 class="m-0">${activeUser.name}</h5>
            ${activeUser.isAdmin ? '<span class="badge-admin">ADMIN</span>' : ''}
          </div>
          <p class="text-secondary small mb-2"><i class="fa-solid fa-phone me-1"></i>${activeUser.phone}</p>
          <button class="btn btn-outline-warning btn-sm mb-3" onclick="renderSetupAccountView(document.getElementById('app-content'))">
            <i class="fa-solid fa-pen-to-square me-1"></i>Editar Meus Dados
          </button>
          
          <div class="stamp-grid">
            ${slotsHTML}
          </div>

          <button class="btn btn-accent w-100 mt-3 py-2" onclick="alert('Pedido de carimbo enviado ao Admin!')">
            <i class="fa-solid fa-paper-plane me-2"></i>Pedir Carimbo do Jantar
          </button>
          <button class="btn btn-link text-danger btn-sm mt-2" onclick="logout()">Terminar Sessão</button>
        </div>
      `;
    }

    function renderEventsTab(container) {
      container.innerHTML = `
        <div class="card-custom p-3">
          <h5 class="text-warning"><i class="fa-solid fa-utensils me-2"></i>Próximo Jantar</h5>
          <h4>Jantar do Grupo Holstein</h4>
          <p class="text-secondary mb-1"><i class="fa-regular fa-calendar me-2"></i>15 de Novembro de 2026</p>
          <p class="text-secondary"><i class="fa-solid fa-location-dot me-2"></i>Torres Novas</p>
          <div class="d-flex gap-2 mt-3">
            <button class="btn btn-success flex-grow-1 py-2" onclick="alert('Presença confirmada!')">Vou!</button>
            <button class="btn btn-outline-danger flex-grow-1 py-2" onclick="alert('Falta registada.')">Não Vou</button>
          </div>
        </div>
      `;
    }

    function renderRankingTab(container) {
      let list = members.map((m, idx) => `
        <div class="d-flex justify-content-between align-items-center p-2 mb-2" style="background: rgba(20,20,25,0.7); border-radius: 8px;">
          <div>
            <strong>#${idx+1} ${m.name}</strong>
          </div>
          <div>
            <span class="badge bg-warning text-dark me-1">🍺 ${m.stamps}</span>
            <span class="badge bg-danger">❌ ${m.crosses}</span>
          </div>
        </div>
      `).join('');

      container.innerHTML = `
        <div class="card-custom p-3">
          <h5 class="text-warning mb-3"><i class="fa-solid fa-trophy me-2"></i>Ranking Mestre</h5>
          ${list}
        </div>
      `;
    }

    function renderAdminTab(container) {
      if (!activeUser.isAdmin) {
        container.innerHTML = `<div class="card-custom p-4 text-center"><p class="text-danger m-0">Apenas os Administradores têm acesso a este painel.</p></div>`;
        return;
      }

      let memberList = members.map(m => `
        <div class="p-2 mb-2 bg-dark rounded d-flex justify-content-between align-items-center">
          <div>
            <div><strong>${m.name}</strong></div>
            <small class="text-secondary">${m.phone}</small>
          </div>
          <div>
            <button class="btn btn-sm btn-warning" onclick="addStamp(${m.id})">+ 🍺</button>
            <button class="btn btn-sm btn-danger" onclick="addCross(${m.id})">+ ❌</button>
          </div>
        </div>
      `).join('');

      container.innerHTML = `
        <div class="card-custom p-3">
          <h5 class="text-warning mb-3"><i class="fa-solid fa-user-shield me-2"></i>Painel Admin</h5>
          <button class="btn btn-accent btn-sm w-100 mb-3" onclick="renderSetupAccountView(document.getElementById('app-content'))">
            <i class="fa-solid fa-user-pen me-1"></i>Editar Os Meus Dados
          </button>
          <h6>Atribuir Carimbos / Cruzes Vermelhas ❌:</h6>
          ${memberList}
        </div>
      `;
    }

    function addStamp(id) {
      const m = members.find(x => x.id === id);
      if (m && m.stamps < 10) {
        m.stamps++;
        saveState();
        renderAdminTab(document.getElementById('app-content'));
      }
    }

    function addCross(id) {
      const m = members.find(x => x.id === id);
      if (m && m.crosses < 10) {
        m.crosses++;
        saveState();
        renderAdminTab(document.getElementById('app-content'));
      }
    }

    // Inicialização
    initApp();
  </script>
</body>
</html>
