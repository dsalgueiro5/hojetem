<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hoje Tem - Grupo Holstein</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg-color: #0d0d10;
      --card-bg: rgba(26, 26, 32, 0.94);
      --accent-color: #f59e0b;
      --accent-hover: #d97706;
      --text-color: #f3f4f6;
      --text-secondary: #9ca3af;
      --danger-color: #ef4444;
      --success-color: #10b981;
    }
    body {
      background-color: var(--bg-color);
      background-image: linear-gradient(rgba(13, 13, 16, 0.88), rgba(13, 13, 16, 0.95)), url('https://i.ibb.co/6P0J9XG/hoje-tem-logo.png');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      color: var(--text-color);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      padding-bottom: 90px;
      min-height: 100vh;
    }
    .app-header {
      background-color: rgba(26, 26, 32, 0.96);
      backdrop-filter: blur(10px);
      border-bottom: 2px solid var(--accent-color);
      padding: 12px;
      text-align: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .app-logo {
      max-height: 65px;
      border-radius: 50%;
      border: 2px solid var(--accent-color);
      box-shadow: 0 0 15px rgba(245, 158, 11, 0.4);
    }
    .app-title {
      font-weight: 800;
      letter-spacing: 2px;
      color: var(--accent-color);
      margin-top: 5px;
      margin-bottom: 0;
      text-transform: uppercase;
      font-size: 1.3rem;
    }
    .card-custom {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
      margin-bottom: 20px;
    }
    .stamp-grid {
      display: grid;
      gap: 12px;
      padding: 15px 0;
    }
    .stamp-slot {
      aspect-ratio: 1;
      background-color: rgba(15, 15, 18, 0.8);
      border: 2px dashed #3a3a45;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.4rem;
      font-weight: bold;
      color: var(--text-secondary);
    }
    .stamp-slot.stamped {
      border: 2px solid var(--accent-color);
      background-color: rgba(245, 158, 11, 0.25);
      color: var(--accent-color);
    }
    .stamp-slot.red-cross {
      border: 2px solid var(--danger-color);
      background-color: rgba(239, 68, 68, 0.25);
      color: var(--danger-color);
    }
    .nav-bottom {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background-color: rgba(26, 26, 32, 0.98);
      backdrop-filter: blur(10px);
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      justify-content: space-around;
      padding: 10px 0;
      z-index: 1000;
    }
    .nav-item-btn {
      background: none;
      border: none;
      color: var(--text-secondary);
      display: flex;
      flex-direction: column;
      align-items: center;
      font-size: 0.7rem;
    }
    .nav-item-btn.active {
      color: var(--accent-color);
      font-weight: bold;
    }
    .nav-item-btn i {
      font-size: 1.2rem;
      margin-bottom: 3px;
    }
    .btn-accent {
      background-color: var(--accent-color);
      color: #000;
      font-weight: 700;
      border: none;
    }
    .btn-accent:hover {
      background-color: var(--accent-hover);
      color: #000;
    }
    .badge-admin {
      background-color: var(--accent-color);
      color: #000;
      font-weight: bold;
      font-size: 0.7rem;
      padding: 3px 8px;
      border-radius: 10px;
    }
  </style>
</head>
<body>

  <header class="app-header">
    <img id="appLogoImg" src="https://i.ibb.co/6P0J9XG/hoje-tem-logo.png" alt="Hoje Tem Logo" class="app-logo" onerror="this.src='https://via.placeholder.com/65/f59e0b/000000?text=HOJE+TEM'">
    <h3 class="app-title" id="appTitleText">Hoje Tem</h3>
  </header>

  <div class="container mt-3" id="app-content">
    <!-- Conteúdo Dinâmico -->
  </div>

  <nav class="nav-bottom" id="app-nav" style="display: none;">
    <button class="nav-item-btn active" onclick="switchTab('card', event)">
      <i class="fa-solid fa-id-card"></i> Cartão
    </button>
    <button class="nav-item-btn" onclick="switchTab('events', event)">
      <i class="fa-solid fa-calendar-days"></i> Jantares
    </button>
    <button class="nav-item-btn" onclick="switchTab('ranking', event)">
      <i class="fa-solid fa-trophy"></i> Ranking
    </button>
    <button class="nav-item-btn" onclick="switchTab('settings', event)">
      <i class="fa-solid fa-gear"></i> Definições
    </button>
  </nav>

  <script>
    // Configurações Globais da App
    let appSettings = JSON.parse(localStorage.getItem('hojetem_settings')) || {
      groupName: "Holstein",
      totalStamps: 6, // Padrão: 6 jantares no ano
      bgImage: "https://i.ibb.co/6P0J9XG/hoje-tem-logo.png",
      logoImage: "https://i.ibb.co/6P0J9XG/hoje-tem-logo.png"
    };

    // Estado do Utilizador e Membros
    let activeUser = JSON.parse(localStorage.getItem('hojetem_user')) || null;

    let members = JSON.parse(localStorage.getItem('hojetem_members')) || [
      { id: 1, name: "Diogo Salgueiro", phone: "910000000", pass: "admin123", isAdmin: true, stamps: 0, crosses: 0, rsvp: null },
      { id: 2, name: "João Canastra", phone: "912345678", pass: "123", isAdmin: false, stamps: 0, crosses: 0, rsvp: 'yes' },
      { id: 3, name: "Maria Silva", phone: "919876543", pass: "123", isAdmin: false, stamps: 0, crosses: 0, rsvp: 'no' }
    ];

    function saveState() {
      localStorage.setItem('hojetem_settings', JSON.stringify(appSettings));
      localStorage.setItem('hojetem_members', JSON.stringify(members));
      if (activeUser) {
        localStorage.setItem('hojetem_user', JSON.stringify(activeUser));
      }
      applyCustomStyles();
    }

    function applyCustomStyles() {
      if (appSettings.bgImage) {
        document.body.style.backgroundImage = `linear-gradient(rgba(13, 13, 16, 0.88), rgba(13, 13, 16, 0.95)), url('${appSettings.bgImage}')`;
      }
      if (appSettings.logoImage) {
        document.getElementById('appLogoImg').src = appSettings.logoImage;
      }
    }

    function initApp() {
      applyCustomStyles();
      const content = document.getElementById('app-content');
      const nav = document.getElementById('app-nav');

      if (!activeUser) {
        nav.style.display = 'none';
        renderLoginView(content);
      } else {
        nav.style.display = 'flex';
        switchTab('card');
      }
    }

    function renderLoginView(container) {
      container.innerHTML = `
        <div class="card-custom p-4">
          <h4 class="text-center text-warning mb-4"><i class="fa-solid fa-right-to-bracket me-2"></i>Entrar no Hoje Tem</h4>
          <div class="mb-3">
            <label class="form-label small text-secondary">Nº de Telemóvel</label>
            <input type="tel" id="loginPhone" class="form-control bg-dark text-white border-secondary" placeholder="Ex: 910000000">
          </div>
          <div class="mb-4">
            <label class="form-label small text-secondary">Palavra-passe</label>
            <input type="password" id="loginPass" class="form-control bg-dark text-white border-secondary" placeholder="Tua palavra-passe">
          </div>
          <button class="btn btn-accent w-100 py-2 mb-3" onclick="handleLogin()">Entrar</button>
          <hr class="border-secondary">
          <p class="text-center small text-secondary mb-2">Primeira vez? Configura a tua conta:</p>
          <button class="btn btn-outline-light btn-sm w-100" onclick="renderSetupAccountView(document.getElementById('app-content'))">
            Criar Conta / Configurar Dados
          </button>
        </div>
      `;
    }

    function handleLogin() {
      const phone = document.getElementById('loginPhone').value.trim();
      const pass = document.getElementById('loginPass').value.trim();

      const user = members.find(m => m.phone === phone && m.pass === pass);
      if (user) {
        activeUser = user;
        saveState();
        initApp();
      } else {
        alert("Telemóvel ou palavra-passe incorretos! (Dica Admin: 910000000 / admin123)");
      }
    }

    function renderSetupAccountView(container) {
      container.innerHTML = `
        <div class="card-custom p-4">
          <h4 class="text-center text-warning mb-3"><i class="fa-solid fa-user-gear me-2"></i>Os Meus Dados</h4>
          <div class="mb-3">
            <label class="form-label small text-secondary">Nome Completo</label>
            <input type="text" id="setupName" class="form-control bg-dark text-white border-secondary" value="${activeUser ? activeUser.name : ''}" placeholder="O teu nome">
          </div>
          <div class="mb-3">
            <label class="form-label small text-secondary">Telemóvel Real</label>
            <input type="tel" id="setupPhone" class="form-control bg-dark text-white border-secondary" value="${activeUser ? activeUser.phone : ''}" placeholder="Ex: 912345678">
          </div>
          <div class="mb-4">
            <label class="form-label small text-secondary">Palavra-passe</label>
            <input type="password" id="setupPass" class="form-control bg-dark text-white border-secondary" value="${activeUser ? activeUser.pass : ''}" placeholder="Escolhe uma palavra-passe">
          </div>
          <button class="btn btn-accent w-100 py-2 mb-2" onclick="saveUserData()">Guardar Dados</button>
          <button class="btn btn-link text-secondary w-100 btn-sm" onclick="initApp()">Voltar</button>
        </div>
      `;
    }

    function saveUserData() {
      const name = document.getElementById('setupName').value.trim();
      const phone = document.getElementById('setupPhone').value.trim();
      const pass = document.getElementById('setupPass').value.trim();

      if (!name || !phone || !pass) {
        alert("Por favor preenche todos os campos!");
        return;
      }

      if (activeUser) {
        activeUser.name = name;
        activeUser.phone = phone;
        activeUser.pass = pass;
        const idx = members.findIndex(m => m.id === activeUser.id);
        if (idx !== -1) members[idx] = activeUser;
      } else {
        activeUser = {
          id: Date.now(),
          name: name,
          phone: phone,
          pass: pass,
          isAdmin: members.length === 0 || phone === "910000000",
          stamps: 0,
          crosses: 0,
          rsvp: null
        };
        members.push(activeUser);
      }

      saveState();
      alert("Dados guardados com sucesso!");
      initApp();
    }

    function logout() {
      activeUser = null;
      localStorage.removeItem('hojetem_user');
      initApp();
    }

    function switchTab(tab, evt) {
      document.querySelectorAll('.nav-item-btn').forEach(b => b.classList.remove('active'));
      if (evt && evt.currentTarget) evt.currentTarget.classList.add('active');

      const content = document.getElementById('app-content');
      if (tab === 'card') renderCardTab(content);
      else if (tab === 'events') renderEventsTab(content);
      else if (tab === 'ranking') renderRankingTab(content);
      else if (tab === 'settings') renderSettingsTab(content);
    }

    // --- ABA DO CARTÃO DE CARIMBOS ---
    function renderCardTab(container) {
      const total = appSettings.totalStamps;
      let slotsHTML = '';

      // Grid dinâmica consoante o total de carimbos
      const columns = total <= 6 ? total : 5;

      for (let i = 0; i < total; i++) {
        if (i < activeUser.stamps) {
          slotsHTML += `<div class="stamp-slot stamped"><i class="fa-solid fa-beer-mug-empty"></i></div>`;
        } else if (i < activeUser.stamps + activeUser.crosses) {
          slotsHTML += `<div class="stamp-slot red-cross"><i class="fa-solid fa-xmark"></i></div>`;
        } else {
          slotsHTML
